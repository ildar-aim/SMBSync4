plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ildar_aim.smbsync4'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.ildar_aim.smbsync4"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable 'MissingTranslation'
        abortOnError false
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            if (variant.buildType.name == "debug") {
                outputFileName = "SMBSync4_debug.apk"
            } else {
                def vn = variant.versionName
                def vc = String.format("%04d", variant.versionCode)
                outputFileName = "SMBSync4_${vn}_${vc}_release.apk"
            }
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.0'

    // SMB/CIFS libraries
    implementation files('libs/jcifs-ng-2.1.6-20201207-01.jar')
    implementation files('libs/jcifs-1.3.17_patch.jar')
    implementation files('libs/JcifsFile2-1.0.8.jar')

    // Security
    implementation files('libs/bcprov-jdk15to18-1.66.jar')

    // Custom utilities (AAR — Jetifier transforms support→AndroidX in bytecode)
    implementation(name: 'Utilities3-1.0.3', ext: 'aar')

    // Metadata & Markdown
    implementation files('libs/metadata-extractor-2.11.0.jar')
    implementation files('libs/MarkDownJ_0.4.jar')
}
